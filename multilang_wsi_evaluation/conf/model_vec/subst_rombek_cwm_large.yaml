defaults:
  - _self_

subst_params:
  path_to_configs: ${hydra:runtime.cwd}/multilang_wsi_evaluation/conf/model_vec/subst_params
  mask_count: [4]
  lang_substs:
    en:
      - en_(and_also)_left
      - en_(and_also)_right
    ru:
      - ru2_(and_also)_left
      - ru2_(and_also)_right
    sl:
      - sl_(and_also)_left
      - sl_(and_also)_right
    bg:
      - bg_(and_also)_left
      - bg_(and_also)_right
    ja:
      - ja_(and_also)_left
      - ja_(and_also)_right
    it:
      - it_(and_also)_left
      - it_(and_also)_right
    zh:
      - zh_(and_also)_left
      - zh_(and_also)_right

_target_: SubstWSI_rombek.src.VectorizingPipeline.VectorizingPipeline

substs_overrides:
  path_to_substs: ${hydra:runtime.cwd}/SubstWSI_rombek/substs
  model_path: ${hydra:runtime.cwd}/xlmr_large_cwm/model.pt
  fill_masks: 4
  topk: 150
  debug: False
  version: 4
  beam_search: True

preprocessor_config:
  disable: False

lemma_config:
  mode: word
  lemmatizer_name: stanza
  cache_path: ${hydra:runtime.cwd}/SubstWSI_rombek/.lemma_cachecwm
  lemmas_similarity_threshold: 1.0

vec_config:
  patterns_probs: 0
  vec_mode: rombek
  base_vec: tfidf # count
  comb_mode: mean
  ood_mode: eps
  top_k: 150
  ood_prob: 1e-7
#  min_df: 0.05
#  max_df: 0.95
