en:
  lang: "en"
  post_processing:
    - class: lexsubgen.post_processors.lemmatizer.Lemmatizer
      lemmatizer: "spacy_old"
      strategy: "sum"
      lang: "en"
    - class: lexsubgen.post_processors.target_excluder.TargetExcluder
