defaults:
  - _self_

subst_params:
  path_to_configs: ${hydra:runtime.cwd}/multilang_wsi_evaluation/conf/model_vec/subst_params
  mask_count: [3]
  lang_substs:
    en:
      - en_(or_even)_left
      - en_(or_even)_right
    ru:
      - ru_(or_even)_left
      - ru_(or_even)_right
    sl:
      - sl_(or_even)_left
      - sl_(or_even)_right
    bg:
      - bg_(or_even)_left
      - bg_(or_even)_right
    ja:
      - ja_(or_even)_left
      - ja_(or_even)_right
    it:
      - it_(or_even)_left
      - it_(or_even)_right
    zh:
      - zh_(or_even)_left
      - zh_(or_even)_right

_target_: SubstWSI_rombek.src.VectorizingPipeline.VectorizingPipeline

substs_overrides:
  path_to_substs: ${hydra:runtime.cwd}/SubstWSI_rombek/substs
  model_path: ${hydra:runtime.cwd}/xlmr_large_cwm_v2/model.pt
#  fill_masks: 4
  topk: 150
  debug: False
  version: 4
  beam_search: True

preprocessor_config:
  disable: False

lemma_config:
  mode: word
  lemmatizer_name: stanza
  cache_path: ${hydra:runtime.cwd}/SubstWSI_rombek/1234512125125
  lemmas_similarity_threshold: 1.0
  lang: ru

vec_config:
  patterns_probs: 0
  vec_mode: rombek
  base_vec: tfidf # count
  comb_mode: mean
  ood_mode: eps
  top_k: 150
  ood_prob: 1e-7
#  min_df: 0.05
#  max_df: 0.95

