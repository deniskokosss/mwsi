defaults:
  - setup_hydra
  - _self_
  - model_vec:
  # https://github.com/facebookresearch/hydra/issues/1939
  - model_clusterer@model_clusterers.agglomerative: agglomerative
#  - model_clusterer@model_clusterers.amrami_paper: amrami_paper
#  - model_clusterer@model_clusterers.optics: optics

# hydra:
#   run:
#     dir: outputs/2022-08-30_23-30-00/agglomerative
#return_value:
#  # metric and dataset to optimize
#  metric: ARI
#  dataset: russe_bts-rnc-ru-train

eval_params:
  list_paths_datasets:
    - ${hydra:runtime.cwd}/datasets/xl_wsd/sl/dev.tsv
    - ${hydra:runtime.cwd}/datasets/xl_wsd/multilang/test.tsv
    - ${hydra:runtime.cwd}/datasets/xl_wsd/en/dev.tsv
    - ${hydra:runtime.cwd}/datasets/se10/en/semeval10.tsv
    - ${hydra:runtime.cwd}/datasets/russe_bts-rnc/ru/test-private.tsv
    - ${hydra:runtime.cwd}/datasets/se13
  use_fast_semeval_metrics: false

  default_subsets_strategy:
    _target_: multilang_wsi_evaluation.subsets_strategy.FullySharedStrategy
  clusterers_subsets_strategy:
    _target_: multilang_wsi_evaluation.subsets_strategy.FullySharedStrategy

run_settings:
  verbose: true
  random_state: 42
