defaults:
  - _self_

subst_params:
  path_to_configs: ${hydra:runtime.cwd}/multilang_wsi_evaluation/conf/model_vec/subst_params
  mask_count: [4]
  lang_substs:
    en:
      - en_or_left
      - en_or_right
    ru:
      - ru_or_left
      - ru_or_right
    sl:
      - sl_or_left
      - sl_or_right
    bg:
      - bg_or_left
      - bg_or_right
    ja:
      - ja_or_left
      - ja_or_right
    it:
      - it_or_left
      - it_or_right
    zh:
      - zh_or_left
      - zh_or_right

_target_: SubstWSI_rombek.src.VectorizingPipeline.VectorizingPipeline

substs_overrides:
  path_to_substs: ${hydra:runtime.cwd}/SubstWSI_rombek/substs
  model_path: ${hydra:runtime.cwd}/xlmr_large_cwm_v2/model.pt
#  fill_masks: 3
  topk: 150
  debug: False
  version: 4
  beam_search: True

preprocessor_config:
  disable: False

lemma_config:
  mode: word
  lemmatizer_name: stanza
  cache_path: ${hydra:runtime.cwd}/SubstWSI_rombek/123452112
  lemmas_similarity_threshold: 1.0
  lang: ru

vec_config:
  patterns_probs: 0
  vec_mode: rombek
  base_vec: tfidf # count
  comb_mode: mean
  ood_mode: eps
  top_k: 150
  ood_prob: 1e-7
#  min_df: 0.05
#  max_df: 0.95
