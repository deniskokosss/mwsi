clusterer:
  _target_: SubstWSI_rombek.src.AmramiClusterer.AmramiClusterer
  hard_clusterer:
    agglo:
      _target_: sklearn.cluster.AgglomerativeClustering
      n_clusters: [2]
      affinity: cosine
      linkage: average
  n_clusters_override: [2, 3, 4, 5, 6, 7, 8, 9]
  n_represents: [15]
  use_sampling: [True]
  use_cluster_merging: [True]
  return_soft_clustering: [False]
