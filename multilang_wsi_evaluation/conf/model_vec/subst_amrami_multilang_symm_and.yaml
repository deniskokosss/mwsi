defaults:
  - _self_

subst_params:
  path_to_configs: ${hydra:runtime.cwd}/multilang_wsi_evaluation/conf/model_vec/subst_params
  lang_substs:
    en:
      - en_and_right
      - en_and_left
    ru:
      - ru_and_right
      - ru_and_left
    sl:
      - sl_and_right
      - sl_and_left
    bg:
      - bg_and_right
      - bg_and_left
    ja:
      - ja_and_right
      - ja_and_left
    it:
      - it_and_right
      - it_and_left
    zh:
      - zh_and_right
      - zh_and_left

_target_: SubstWSI_rombek.src.VectorizingPipeline.VectorizingPipeline

preprocessor_config:
  disable: False

substs_overrides:
  path_to_substs: ${hydra:runtime.cwd}/SubstWSI_rombek/substs
  model_path: /home/narefyev/_data/fairseq-xlmr-large/model.pt
  fill_masks: 2

lemma_config:
  mode: word
  lemmatizer_name: stanza

vec_config:
  vec_mode: amrami
  ood_mode: res_mean
  comb_mode: prod
  vocab_size: 250000
  top_k: 128
  vec_transform: binary
  min_df: 2
  max_df: 0.95
