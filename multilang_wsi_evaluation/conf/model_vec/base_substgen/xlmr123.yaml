class: lexsubgen.subst_generator.SubstituteGenerator
pre_processing: []
prob_estimator:
  class: lexsubgen.prob_estimators.combiner.BCombFasttextCombiner
  prob_estimators:
    - class: lexsubgen.prob_estimators.combiner.MaxCombiner
      merge_vocab_type: union
      prob_estimators:
        - class: lexsubgen.prob_estimators.xlmr_estimator.XLMRProbEstimatorMultimasked
          topk: 175
          model_name: ${hydra:runtime.cwd}/xlmr_large/model.pt
          num_masks: 1
        - class: lexsubgen.prob_estimators.xlmr_estimator.XLMRProbEstimatorMultimasked
          topk: 175
          model_name: ${hydra:runtime.cwd}/xlmr_large/model.pt
          num_masks: 2
        - class: lexsubgen.prob_estimators.xlmr_estimator.XLMRProbEstimatorMultimasked
          topk: 175
          model_name: ${hydra:runtime.cwd}/xlmr_large/model.pt
          num_masks: 3
  k: 4.0
  s: 1.0
  temperature: 0.07
  beta: 0.0
  lang: en
post_processing: []
top_k: 20
