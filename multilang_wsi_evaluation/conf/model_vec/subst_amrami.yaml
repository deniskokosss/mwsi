defaults:
  - _self_

subst_params:
  path_to_configs: ${hydra:runtime.cwd}/multilang_wsi_evaluation/conf/model_vec/subst_params
  lang_substs:
    en:
      - en_(or_even)_right_amrami
      - T_amrami

_target_: SubstWSI_rombek.src.VectorizingPipeline.VectorizingPipeline

preprocessor_config:
  disable: True

substs_overrides:
  path_to_substs: ${hydra:runtime.cwd}/SubstWSI_rombek/substs/amrami_style
  model_path: bert-large-uncased
  topk: 1000

lemma_config:
  mode: word
  lemmatizer_name: spacy

vec_config:
  vec_mode: amrami
  ood_mode: res_mean
  vocab_size: 30522
  top_k: 100
  vec_transform: binary
  min_df: 2
  max_df: 0.95
