defaults:
  - setup_hydra
  - _self_
  - model_vec:
  # https://github.com/facebookresearch/hydra/issues/1939
  - model_clusterer@model_clusterers.agglomerative: agglomerative

return_value:
  # metric and dataset to optimize
  metric: ARI
  dataset: russe_bts-rnc-ru-train

eval_params:
  metrics: [
      seuclidean
  ]
  callable_metrics: [
      scipy.spatial.distance.cosine,
      scipy.spatial.distance.cityblock,
      scipy.spatial.distance.euclidean,
      scipy.spatial.distance.correlation,
      scipy.spatial.distance.hamming,
      GLM.glm_vectorizer.norm_l1
  ]
  list_paths_datasets:
    - ${hydra:runtime.cwd}/datasets/se10/en/semeval10.tsv
    - ${hydra:runtime.cwd}/datasets/se13
    - ${hydra:runtime.cwd}/datasets/xl_wsd/en
  use_fast_semeval_metrics: false

run_settings:
  verbose: true
  random_state: 42
